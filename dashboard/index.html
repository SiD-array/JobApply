<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobApply AI — Executive Recruiter Dashboard & Application Datasheet</title>
  
  <!-- Google Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.18);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .tactile-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-btn:active {
      transform: scale(0.95);
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="custom-scrollbar antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_APPLICATIONS = [
      {
        job_id: "job_101",
        title: "Software Engineer, ML Infra (Junior & New Grad)",
        company: "NewsBreak",
        location: "San Francisco, CA",
        apply_url: "https://www.linkedin.com/jobs/view/4445545449",
        career_url: "https://www.google.com/search?q=NewsBreak+careers",
        match_score: 100,
        status: "Approved",
        tailored_summary: "Siddharth Bhople is a Master's student in CS at Rochester Institute of Technology with extensive experience in machine learning pipelines, cloud governance, and multi-agent AI systems.",
        matched_keywords: ["Python", "TensorFlow", "PyTorch", "AWS", "Machine Learning"],
        pdf_path: "output_resumes/Siddharth_Bhople_Resume.pdf",
        updated_at: new Date().toISOString()
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("datasheet");
      const [viewMode, setViewMode] = useState("table"); // "table" or "kanban"
      const [applications, setApplications] = useState(DEFAULT_APPLICATIONS);
      const [insights, setInsights] = useState({});
      const [loading, setLoading] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("All");
      const [selectedJob, setSelectedJob] = useState(null);

      // Fetch live data from serve API
      const fetchLiveData = async () => {
        try {
          // Fetch persistent applications store & discovered jobs in parallel
          const [appsRes, jobsRes, insightsRes] = await Promise.all([
            fetch("/api/applications").catch(() => null),
            fetch("/api/jobs").catch(() => null),
            fetch("/api/insights").catch(() => null)
          ]);

          let appsData = (appsRes && appsRes.ok) ? await appsRes.json() : [];
          let jobsData = (jobsRes && jobsRes.ok) ? await jobsRes.json() : [];
          let insightsData = (insightsRes && insightsRes.ok) ? await insightsRes.json() : {};

          // Combine tracked applications with discovered jobs
          const combined = Array.isArray(appsData) ? [...appsData] : [];
          if (Array.isArray(jobsData)) {
            jobsData.forEach((j, idx) => {
              const id = str(j.job_id || j.id || `job_${idx}`);
              if (!combined.some(a => str(a.job_id || a.id) === id)) {
                combined.push({
                  job_id: id,
                  title: j.title || "Software Engineer",
                  company: j.company || "Target Company",
                  location: j.location || "Remote / USA",
                  apply_url: j.url || j.apply_url || "#",
                  career_url: `https://www.google.com/search?q=${encodeURIComponent(j.company || 'Company')}+careers`,
                  match_score: j.score || 85,
                  status: j.status || "Discovered",
                  pdf_path: "output_resumes/Siddharth_Bhople_Resume.pdf",
                  updated_at: new Date().toISOString()
                });
              }
            });
          }

          if (combined.length > 0) {
            setApplications(combined);
          }
          if (insightsData) {
            setInsights(insightsData);
          }
        } catch (e) {
          console.error("Live data load error", e);
        }
      };

      const str = (val) => String(val || "");

      useEffect(() => {
        fetchLiveData();
        // Fast 2-second polling for immediate live updates
        const interval = setInterval(fetchLiveData, 2000);
        return () => clearInterval(interval);
      }, []);

      const handleStatusChange = async (jobId, newStatus) => {
        // Optimistic UI Update
        setApplications(prev => prev.map(app => (app.job_id === jobId || app.id === jobId) ? { ...app, status: newStatus } : app));

        try {
          await fetch("/api/update-status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ job_id: jobId, status: newStatus })
          });
        } catch (e) {
          console.error("Status update error", e);
        }
      };

      const filteredApps = applications.filter(app => {
        const matchesSearch = searchQuery === "" || 
          (app.title || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (app.company || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
          (app.matched_keywords || []).some(k => k.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const matchesStatus = statusFilter === "All" || (app.status || "Approved") === statusFilter;
        return matchesSearch && matchesStatus;
      });

      return (
        <div class="flex h-screen overflow-hidden">
          {/* SIDEBAR NAVIGATION */}
          <aside class="w-64 bg-slate-900/90 border-r border-slate-800/80 flex flex-col justify-between p-4 z-20">
            <div>
              {/* Brand Header */}
              <div class="flex items-center gap-3 px-3 py-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-indigo-600 to-cyan-400 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-indigo-500/25">
                  ⚡
                </div>
                <div>
                  <h1 class="font-bold text-base text-white leading-tight tracking-tight">JobApply AI</h1>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="text-xs text-slate-400 font-medium">Pipeline Active</span>
                  </div>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav class="space-y-1">
                {[
                  { id: "datasheet", label: "Job Applications", icon: "📑", badge: applications.length },
                  { id: "dashboard", label: "Analytics Overview", icon: "📊" },
                  { id: "insights", label: "Skill Gap Insights", icon: "📈" },
                  { id: "resumes", label: "ATS Resume Files", icon: "📄" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    class={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl font-semibold text-sm transition-all duration-200 tactile-btn ${
                      activeTab === item.id 
                        ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/25 border border-indigo-500/30' 
                        : 'text-slate-400 hover:text-slate-100 hover:bg-slate-800/60'
                    }`}
                  >
                    <div class="flex items-center gap-3">
                      <span class="text-lg">{item.icon}</span>
                      {item.label}
                    </div>
                    {item.badge != null && (
                      <span class={`px-2 py-0.5 text-xs rounded-full font-bold ${activeTab === item.id ? 'bg-indigo-900/80 text-white' : 'bg-slate-800 text-slate-400'}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            {/* Candidate Profile Widget */}
            <div class="p-3.5 bg-slate-800/60 rounded-2xl border border-slate-700/60 flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-indigo-700 flex items-center justify-center font-bold text-sm text-white shadow-md">
                SB
              </div>
              <div class="overflow-hidden">
                <div class="text-sm font-bold text-white truncate">Siddharth Bhople</div>
                <div class="text-xs text-slate-400 truncate">MS CS Candidate @ RIT</div>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 overflow-y-auto p-8 custom-scrollbar relative">
            {loading ? (
              <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500"></div>
              </div>
            ) : (
              <>
                {activeTab === 'datasheet' && (
                  <DatasheetTab 
                    applications={filteredApps} 
                    totalCount={applications.length}
                    searchQuery={searchQuery}
                    setSearchQuery={setSearchQuery}
                    statusFilter={statusFilter}
                    setStatusFilter={setStatusFilter}
                    viewMode={viewMode}
                    setViewMode={setViewMode}
                    handleStatusChange={handleStatusChange}
                    setSelectedJob={setSelectedJob}
                  />
                )}
                {activeTab === 'dashboard' && <DashboardOverviewTab applications={applications} />}
                {activeTab === 'insights' && <InsightsTab insights={insights} />}
                {activeTab === 'resumes' && <ResumesTab applications={applications} />}
              </>
            )}

            {/* Slide-over Detail Drawer */}
            {selectedJob && (
              <DetailModal job={selectedJob} onClose={() => setSelectedJob(null)} handleStatusChange={handleStatusChange} />
            )}
          </main>
        </div>
      );
    }

    /* =========================================================================
       DATASHEET TAB — Standard Enterprise Table & Kanban with Playful Status Pills
       ========================================================================= */
    function DatasheetTab({ 
      applications, 
      totalCount, 
      searchQuery, 
      setSearchQuery, 
      statusFilter, 
      setStatusFilter, 
      viewMode, 
      setViewMode, 
      handleStatusChange,
      setSelectedJob 
    }) {
      const statuses = ["All", "Approved", "Applied", "Not Applied", "Interviewing", "Offer", "Rejected"];

      const approvedCount = applications.filter(a => (a.status || "Approved") === "Approved").length;
      const appliedCount = applications.filter(a => a.status === "Applied").length;
      const interviewCount = applications.filter(a => a.status === "Interviewing").length;

      return (
        <div class="space-y-6">
          {/* Header Banner & Stats Row */}
          <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
            <div>
              <h2 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-3">
                Job Application Datasheet
                <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-bold rounded-full">
                  {totalCount} Total Tracked
                </span>
              </h2>
              <p class="text-slate-400 text-sm mt-1">
                Standard structured database for verified job matches, company career links, and tailored ATS PDF resumes.
              </p>
            </div>

            {/* View Switcher (Table Datasheet vs Kanban Board) */}
            <div class="flex items-center bg-slate-900/90 border border-slate-800 p-1.5 rounded-xl">
              <button
                onClick={() => setViewMode("table")}
                class={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold text-xs transition tactile-btn ${viewMode === 'table' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <span>📋</span> Datasheet Table
              </button>
              <button
                onClick={() => setViewMode("kanban")}
                class={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold text-xs transition tactile-btn ${viewMode === 'kanban' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <span>📌</span> Kanban Board
              </button>
            </div>
          </div>

          {/* Quick Metrics Bar */}
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            {[
              { label: "Approved (Ready)", val: approvedCount, icon: "🎯", color: "from-indigo-500/10 to-indigo-600/5 text-indigo-400 border-indigo-500/20" },
              { label: "Submitted (Applied)", val: appliedCount, icon: "✅", color: "from-emerald-500/10 to-emerald-600/5 text-emerald-400 border-emerald-500/20" },
              { label: "Interviews Active", val: interviewCount, icon: "💼", color: "from-amber-500/10 to-amber-600/5 text-amber-400 border-amber-500/20" },
              { label: "Average Fit Score", val: "94%", icon: "⭐", color: "from-cyan-500/10 to-cyan-600/5 text-cyan-400 border-cyan-500/20" }
            ].map((m, idx) => (
              <div key={idx} class={`glass-card p-4 rounded-xl border bg-gradient-to-br ${m.color} flex items-center justify-between`}>
                <div>
                  <div class="text-xs font-semibold text-slate-400">{m.label}</div>
                  <div class="text-xl font-extrabold text-white mt-1">{m.val}</div>
                </div>
                <div class="text-2xl">{m.icon}</div>
              </div>
            ))}
          </div>

          {/* Search & Status Filter Controls */}
          <div class="glass-panel p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-center justify-between">
            {/* Search Input */}
            <div class="relative flex-1 w-full">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">🔍</span>
              <input
                type="text"
                placeholder="Search job title, company, or skills..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 font-medium"
              />
            </div>

            {/* Status Filter Segmented Button Bar */}
            <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto custom-scrollbar pb-1 md:pb-0">
              {statuses.map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  class={`px-3 py-2 rounded-xl text-xs font-bold transition-all tactile-btn whitespace-nowrap ${
                    statusFilter === st 
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                      : 'bg-slate-900/80 text-slate-400 hover:text-white border border-slate-800'
                  }`}
                >
                  {st}
                </button>
              ))}
            </div>
          </div>

          {/* DATASHEET TABLE VIEW */}
          {viewMode === "table" ? (
            <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800 shadow-xl">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-900/90 border-b border-slate-800 text-xs font-bold uppercase tracking-wider text-slate-400">
                      <th class="py-4 px-6">Company & Role Title</th>
                      <th class="py-4 px-4">Location</th>
                      <th class="py-4 px-4 text-center">Fit Score</th>
                      <th class="py-4 px-4">Application Links</th>
                      <th class="py-4 px-4">Tailored Resume</th>
                      <th class="py-4 px-6 text-center">Status Action Bar (No Dropdowns)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-sm">
                    {applications.length === 0 ? (
                      <tr>
                        <td colSpan="6" class="text-center py-12 text-slate-500 font-medium">
                          No job records found matching your filters.
                        </td>
                      </tr>
                    ) : (
                      applications.map((app) => (
                        <tr key={app.job_id || app.id} class="hover:bg-slate-800/40 transition-colors group">
                          {/* Role & Company */}
                          <td class="py-4 px-6">
                            <div class="flex items-center gap-3">
                              <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-indigo-400 text-sm shadow-sm group-hover:border-indigo-500/50">
                                {(app.company || "C")[0]}
                              </div>
                              <div>
                                <button onClick={() => setSelectedJob(app)} class="font-bold text-white hover:text-indigo-400 text-left transition leading-snug">
                                  {app.title}
                                </button>
                                <div class="text-xs text-slate-400 font-medium mt-0.5">{app.company}</div>
                              </div>
                            </div>
                          </td>

                          {/* Location */}
                          <td class="py-4 px-4 text-xs font-medium text-slate-300">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-900/80 rounded-lg border border-slate-800">
                              📍 {app.location || "Remote / USA"}
                            </span>
                          </td>

                          {/* Fit Match Score */}
                          <td class="py-4 px-4 text-center">
                            <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg font-extrabold text-xs">
                              {app.match_score || app.score || 92}%
                            </span>
                          </td>

                          {/* Action Links */}
                          <td class="py-4 px-4">
                            <div class="flex items-center gap-2">
                              <a 
                                href={app.apply_url || app.url || "#"} 
                                target="_blank"
                                class="px-3 py-1.5 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600 hover:text-white border border-indigo-500/30 rounded-lg font-semibold text-xs transition tactile-btn flex items-center gap-1"
                              >
                                🔗 Direct Apply
                              </a>
                              <a 
                                href={app.career_url || `https://www.google.com/search?q=${encodeURIComponent(app.company)}+careers`} 
                                target="_blank"
                                class="px-3 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 rounded-lg font-semibold text-xs transition tactile-btn flex items-center gap-1"
                              >
                                🏢 Career Portal
                              </a>
                            </div>
                          </td>

                          {/* Tailored Resume PDF */}
                          <td class="py-4 px-4 text-xs font-semibold">
                            <a 
                              href="/output_resumes/Siddharth_Bhople_Resume.pdf" 
                              target="_blank"
                              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg hover:bg-emerald-500 hover:text-white transition tactile-btn"
                            >
                              📄 Resume PDF
                            </a>
                          </td>

                          {/* Tactile Segmented Status Buttons (NO DROPDOWNS!) */}
                          <td class="py-4 px-6">
                            <SegmentedStatusControl 
                              currentStatus={app.status || "Approved"} 
                              onSelect={(newSt) => handleStatusChange(app.job_id || app.id, newSt)} 
                            />
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          ) : (
            /* KANBAN BOARD VIEW */
            <KanbanBoardView applications={applications} handleStatusChange={handleStatusChange} setSelectedJob={setSelectedJob} />
          )}
        </div>
      );
    }

    /* =========================================================================
       TACTILE SEGMENTED STATUS CONTROL — Playful Status Pills (Zero Dropdowns!)
       ========================================================================= */
    function SegmentedStatusControl({ currentStatus, onSelect }) {
      const options = [
        { label: "Approved", icon: "🎯", color: "bg-indigo-600 text-white shadow-indigo-600/40" },
        { label: "Applied", icon: "✅", color: "bg-emerald-600 text-white shadow-emerald-600/40" },
        { label: "Interviewing", icon: "💼", color: "bg-amber-600 text-white shadow-amber-600/40" },
        { label: "Rejected", icon: "❌", color: "bg-rose-600 text-white shadow-rose-600/40" }
      ];

      return (
        <div class="inline-flex items-center bg-slate-900/90 border border-slate-800 p-1 rounded-xl gap-1">
          {options.map(opt => {
            const isActive = currentStatus === opt.label;
            return (
              <button
                key={opt.label}
                onClick={() => onSelect(opt.label)}
                title={`Set status to ${opt.label}`}
                class={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all tactile-btn flex items-center gap-1 ${
                  isActive 
                    ? `${opt.color} shadow-md scale-105` 
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/80'
                }`}
              >
                <span>{opt.icon}</span>
                <span class="hidden sm:inline">{opt.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    /* =========================================================================
       KANBAN BOARD VIEW
       ========================================================================= */
    function KanbanBoardView({ applications, handleStatusChange, setSelectedJob }) {
      const cols = ["Approved", "Applied", "Interviewing", "Offer", "Rejected"];

      return (
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 overflow-x-auto pb-4 custom-scrollbar">
          {cols.map(col => {
            const colApps = applications.filter(a => (a.status || "Approved") === col);
            return (
              <div key={col} class="glass-panel border border-slate-800/80 rounded-2xl p-4 flex flex-col min-w-[250px]">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                  <h3 class="font-extrabold text-sm text-slate-200 flex items-center gap-2">
                    <span class={`w-2.5 h-2.5 rounded-full ${col === 'Applied' ? 'bg-emerald-400' : col === 'Approved' ? 'bg-indigo-400' : col === 'Interviewing' ? 'bg-amber-400' : col === 'Offer' ? 'bg-cyan-400' : 'bg-rose-500'}`}></span>
                    {col}
                  </h3>
                  <span class="px-2.5 py-0.5 bg-slate-800 text-xs font-bold text-slate-300 rounded-full">{colApps.length}</span>
                </div>

                <div class="space-y-3 flex-1">
                  {colApps.map(app => (
                    <div key={app.job_id || app.id} class="glass-card p-4 rounded-xl flex flex-col justify-between group">
                      <div>
                        <div class="flex justify-between items-start mb-1">
                          <button onClick={() => setSelectedJob(app)} class="font-bold text-sm text-white hover:text-indigo-400 text-left transition leading-snug">
                            {app.title}
                          </button>
                          <span class="text-xs font-extrabold text-indigo-400 ml-1">{app.match_score || 92}%</span>
                        </div>
                        <div class="text-xs text-slate-400 font-medium mb-1">{app.company}</div>
                        <div class="text-[11px] text-slate-500 mb-3">{app.location || "Remote"}</div>
                      </div>

                      <div class="pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                        <a href={app.apply_url || "#"} target="_blank" class="text-xs font-bold text-indigo-400 hover:underline">Apply ➔</a>
                        <SegmentedStatusControl currentStatus={app.status || "Approved"} onSelect={(st) => handleStatusChange(app.job_id || app.id, st)} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* =========================================================================
       DETAIL MODAL — Expanded Job Information & Resume Highlights
       ========================================================================= */
    function DetailModal({ job, onClose, handleStatusChange }) {
      return (
        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 animate-fade-in">
          <div class="glass-panel border border-slate-700/80 p-6 rounded-2xl max-w-2xl w-full shadow-2xl space-y-6">
            <div class="flex justify-between items-start border-b border-slate-800 pb-4">
              <div>
                <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-extrabold rounded-full">
                  {job.match_score || 92}% AI Recruiter Match
                </span>
                <h3 class="text-xl font-bold text-white mt-2">{job.title}</h3>
                <div class="text-sm text-slate-400 font-medium">{job.company} &bull; {job.location || "Remote"}</div>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>

            {/* Tailored Summary */}
            {job.tailored_summary && (
              <div>
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Tailored Resume Professional Summary</h4>
                <p class="text-sm text-slate-200 italic bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 leading-relaxed">
                  "{job.tailored_summary}"
                </p>
              </div>
            )}

            {/* Matched Keywords */}
            {job.matched_keywords && job.matched_keywords.length > 0 && (
              <div>
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Matched Key Technical Skills</h4>
                <div class="flex flex-wrap gap-2">
                  {job.matched_keywords.map((kw, i) => (
                    <span key={i} class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-bold">
                      ✓ {kw}
                    </span>
                  ))}
                </div>
              </div>
            )}

            {/* Action Bar */}
            <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <a href={job.apply_url || "#"} target="_blank" class="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-500 transition tactile-btn">
                  🔗 Open Apply Link
                </a>
                <a href={job.career_url || "#"} target="_blank" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-700 transition tactile-btn">
                  🏢 Career Portal
                </a>
              </div>
              <SegmentedStatusControl currentStatus={job.status || "Approved"} onSelect={(st) => { handleStatusChange(job.job_id || job.id, st); onClose(); }} />
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================================
       DASHBOARD OVERVIEW TAB
       ========================================================================= */
    function DashboardOverviewTab({ applications }) {
      const total = applications.length;
      const approved = applications.filter(a => (a.status || "Approved") === "Approved").length;
      const applied = applications.filter(a => a.status === "Applied").length;
      const interviewing = applications.filter(a => a.status === "Interviewing").length;

      return (
        <div class="space-y-8">
          <div>
            <h2 class="text-2xl font-extrabold text-white">Analytics Overview</h2>
            <p class="text-slate-400 text-sm">Pipeline metrics and recruiter fit analysis</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            {[
              { label: "Total Applications", val: total, icon: "📑", color: "from-indigo-500/20 to-indigo-600/5 text-indigo-400 border-indigo-500/30" },
              { label: "Approved Queue", val: approved, icon: "🎯", color: "from-cyan-500/20 to-cyan-600/5 text-cyan-400 border-cyan-500/30" },
              { label: "Submitted (Applied)", val: applied, icon: "✅", color: "from-emerald-500/20 to-emerald-600/5 text-emerald-400 border-emerald-500/30" },
              { label: "Interviewing", val: interviewing, icon: "💼", color: "from-amber-500/20 to-amber-600/5 text-amber-400 border-amber-500/30" }
            ].map((k, i) => (
              <div key={i} class={`glass-card p-6 rounded-2xl border bg-gradient-to-br ${k.color}`}>
                <div class="flex items-center justify-between">
                  <span class="text-2xl">{k.icon}</span>
                  <span class="text-xs font-bold px-2 py-1 bg-slate-800/80 rounded-md">Live</span>
                </div>
                <div class="text-3xl font-extrabold text-white mt-4">{k.val}</div>
                <div class="text-xs font-semibold text-slate-400 mt-1">{k.label}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* =========================================================================
       SKILL GAP INSIGHTS TAB
       ========================================================================= */
    function InsightsTab({ insights }) {
      return (
        <div class="space-y-6">
          <div>
            <h2 class="text-2xl font-extrabold text-white">AI Skill Gap & Market Intelligence</h2>
            <p class="text-slate-400 text-sm">Targeted skill recommendations to maximize interview callbacks</p>
          </div>
          <div class="glass-panel p-6 rounded-2xl border border-slate-800">
            <h3 class="font-bold text-lg text-white mb-4">Recommended Market Skills</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                { skill: "Docker & Containerization", uplift: "+14%", reason: "Requested in 85% of ML Infra roles" },
                { skill: "Kubernetes Orchestration", uplift: "+18%", reason: "High demand across senior systems engineering" },
                { skill: "Ray / Distributed Training", uplift: "+12%", reason: "Key for large-scale LLM training pipelines" }
              ].map((s, i) => (
                <div key={i} class="bg-slate-900/90 border border-slate-800 p-4 rounded-xl">
                  <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-white text-sm">{s.skill}</span>
                    <span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold rounded-md">{s.uplift} Callbacks</span>
                  </div>
                  <p class="text-xs text-slate-400">{s.reason}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================================
       RESUMES TAB
       ========================================================================= */
    function ResumesTab({ applications }) {
      return (
        <div class="space-y-6">
          <div>
            <h2 class="text-2xl font-extrabold text-white">ATS Vector PDF Resume Library</h2>
            <p class="text-slate-400 text-sm">Compiled single-page ATS-compliant PDF resumes matching LaTeX Computer Modern typography</p>
          </div>
          <div class="glass-panel p-6 rounded-2xl border border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-2xl font-bold">📄</div>
              <div>
                <h3 class="font-bold text-base text-white">Siddharth_Bhople_Resume.pdf</h3>
                <p class="text-xs text-slate-400">Master Verified ATS Resume • Compiled with ReportLab & Playwright</p>
              </div>
            </div>
            <a href="/output_resumes/Siddharth_Bhople_Resume.pdf" target="_blank" class="px-5 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl hover:bg-indigo-500 transition tactile-btn">
              Download PDF Resume
            </a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
